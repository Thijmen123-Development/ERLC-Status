<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075b19">
<title>DDH Roleplay — Live Status</title>
<style>
:root{--green:#075b19;--green2:#034312;--yellow:#ffd84d;--cream:#f7f3e8;--muted:#c9d8c8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;background:#080c08;color:var(--cream);font-family:Inter,Arial,sans-serif}
.dashboard{width:min(1120px,100%);min-height:690px;position:relative;overflow:hidden;border-radius:38px;padding:clamp(24px,5vw,62px);background:linear-gradient(135deg,var(--green),#087021 60%,var(--green2));box-shadow:0 25px 90px #0009;display:flex;flex-direction:column}
.stripe{position:absolute;top:-30%;bottom:-30%;width:15%;transform:skewX(-27deg);background:#003c10;opacity:.34;pointer-events:none}
.stripe.one{left:12%}.stripe.two{left:40%;opacity:.2}.stripe.three{left:83%;opacity:.28}
.stripe.gold{left:67%;width:4%;background:var(--yellow);opacity:.13}
header,.content,.footer,.meta,.actions,.notice{position:relative;z-index:1}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.brand{color:var(--yellow)}
h1{text-align:center;font-size:clamp(2.5rem,7vw,5.7rem);line-height:1;margin:40px 0 10px;letter-spacing:-.065em}
.subtitle{text-align:center;color:var(--muted);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem}
.content{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:46px 0 28px}
.stat{border:1px solid #ffffff25;background:#002d0d55;border-radius:24px;padding:26px;text-align:center;backdrop-filter:blur(4px)}
.stat-label{color:var(--muted);font-size:.82rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.stat-value{font-size:clamp(3.7rem,11vw,7.4rem);font-weight:900;line-height:1.1;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.stat-value.yellow{color:var(--yellow)}
.stat-detail{color:var(--muted);font-size:.92rem;margin-top:6px}
.footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto;font-weight:800}
.pill{border:1px solid #ffffff30;border-radius:999px;padding:11px 16px;background:#003b12a8}
.pill b{color:var(--yellow)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.82rem}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aaa;margin-right:8px}
.status-dot.ok{background:#8bff9b;box-shadow:0 0 10px #8bff9b}
.actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
button,.join{border:1px solid #ffffff45;border-radius:999px;padding:11px 18px;background:#003e12;color:var(--cream);font-weight:800;text-decoration:none;cursor:pointer}
.join{background:var(--yellow);color:#18210d;border-color:var(--yellow)}
button:disabled{opacity:.6;cursor:wait}
.notice{min-height:1.4em;text-align:center;margin-top:12px;color:#ffe1d9;font-size:.85rem}
@media(max-width:620px){body{padding:10px}.dashboard{min-height:calc(100vh - 20px);border-radius:25px;padding:24px 17px}.content{gap:10px;margin:34px 0 22px}.stat{padding:18px 8px;border-radius:18px}.stat-value{font-size:clamp(3rem,15vw,5rem)}h1{margin-top:34px}.footer{font-size:.9rem}.meta{font-size:.74rem}}
</style>
</head>
<body>
<main class="dashboard">
  <div class="stripe one"></div><div class="stripe two"></div><div class="stripe three"></div><div class="stripe gold"></div>
  <header>
    <div class="topline"><span class="brand">DDH ROLEPLAY</span><span>LIVE SERVER STATUS</span></div>
    <h1 id="serverName">In-Game Players</h1>
    <div class="subtitle">Emergency Response: Liberty County</div>
  </header>

  <section class="content" aria-live="polite">
    <div class="stat">
      <div class="stat-label">In-game players</div>
      <div class="stat-value" id="players">--</div>
      <div class="stat-detail">Maximum <span id="maxPlayers">--</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Discord members</div>
      <div class="stat-value yellow" id="discordMembers">--</div>
      <div class="stat-detail" id="discordName">Discord community</div>
    </div>
  </section>

  <section class="footer">
    <div class="pill">JOIN CODE: <b id="joinCode">--------</b></div>
    <div class="pill">QUEUE: <b id="queue">--</b></div>
    <div class="pill">DISCORD: <b>ddhrpnl</b></div>
  </section>
  <section class="meta">
    <span><i class="status-dot" id="erlcDot"></i><span id="erlcStatus">ER:LC connecting…</span></span>
    <span><i class="status-dot" id="discordDot"></i><span id="discordStatus">Discord connecting…</span></span>
    <span>Last update: <time id="updated">—</time></span>
  </section>
  <div class="actions">
    <button id="refresh" type="button">↻ Refresh now</button>
    <a class="join" href="https://discord.gg/ddhrpnl" target="_blank" rel="noopener noreferrer">Join Discord ↗</a>
  </div>
  <div class="notice" id="notice" role="status"></div>
</main>
<script>
"use strict";

/*
  CONFIG
  Paste your ER:LC private server key below.
  WARNING: GitHub Pages is public. Anyone can view this key in this file
  and in browser network requests. This one-file version is NOT secret-safe.
*/
const ERLC_API_KEY = "CfjlBnnGkQLDJHkLRxau-yRJmnWEXfgYPdQywbYWddXCYmTSYVmKAODbAwvPT";
const ERLC_ENDPOINT = "https://api.erlc.gg/v2/server?Queue=true";
const DISCORD_INVITE_CODE = "ddhrpnl";
const REFRESH_INTERVAL = 30_000;

const el = id => document.getElementById(id);
let erlcBusy = false;
let discordBusy = false;

function firstDefined(object, keys) {
  for (const key of keys) {
    if (object && object[key] !== undefined && object[key] !== null) return object[key];
  }
  return undefined;
}
function showStatus(kind, message, online) {
  el(kind + "Status").textContent = message;
  el(kind + "Dot").classList.toggle("ok", Boolean(online));
}
function friendlyFetchError(error, service) {
  if (error instanceof TypeError) {
    return service + " kon niet worden opgehaald. Mogelijk blokkeert CORS de browseraanvraag.";
  }
  return error.message || service + " ophalen mislukt.";
}

async function updateERLC() {
  if (erlcBusy) return;
  if (!ERLC_API_KEY || ERLC_API_KEY === "PASTE_YOUR_ERLC_API_KEY_HERE") {
    showStatus("erlc", "API-key ontbreekt", false);
    el("notice").textContent = "Vul je ER:LC API-key in bovenaan dit bestand bij ERLC_API_KEY.";
    return;
  }

  erlcBusy = true;
  el("refresh").disabled = true;
  try {
    const response = await fetch(ERLC_ENDPOINT, {
      method: "GET",
      headers: { "Server-Key": ERLC_API_KEY, "Accept": "application/json" },
      cache: "no-store"
    });
    if (!response.ok) {
      if (response.status === 401 || response.status === 403) throw new Error("ER:LC API-key ongeldig of geen toegang (HTTP " + response.status + ").");
      if (response.status === 429) throw new Error("ER:LC rate limit. Probeer het later opnieuw.");
      throw new Error("ER:LC API fout (HTTP " + response.status + ").");
    }

    const data = await response.json();
    const server = data.server || data.Server || data;
    const current = firstDefined(server, ["CurrentPlayers", "currentPlayers", "current_players"]);
    const maximum = firstDefined(server, ["MaxPlayers", "maxPlayers", "max_players"]);
    const name = firstDefined(server, ["Name", "name"]);
    const joinCode = firstDefined(server, ["JoinKey", "joinKey", "join_key"]);
    const queue = firstDefined(data, ["Queue", "queue"]) ?? firstDefined(server, ["Queue", "queue"]);

    if (current === undefined || maximum === undefined) {
      throw new Error("ER:LC antwoord ontvangen, maar player count ontbreekt. Controleer API-response en server-key.");
    }

    el("players").textContent = Number(current).toLocaleString();
    el("maxPlayers").textContent = Number(maximum).toLocaleString();
    el("serverName").textContent = name || "In-Game Players";
    el("joinCode").textContent = joinCode || "--------";
    el("queue").textContent = Array.isArray(queue) ? queue.length : (queue ?? 0);
    showStatus("erlc", "ER:LC online", true);
    el("updated").textContent = new Date().toLocaleTimeString();
  } catch (error) {
    showStatus("erlc", "ER:LC niet verbonden", false);
    el("notice").textContent = friendlyFetchError(error, "ER:LC");
    console.error("[ER:LC]", error);
  } finally {
    erlcBusy = false;
    el("refresh").disabled = false;
  }
}

async function updateDiscord() {
  if (discordBusy) return;
  discordBusy = true;
  try {
    // Discord's public Get Invite endpoint returns approximate counts with with_counts=true.
    const url = "https://discord.com/api/v10/invites/" +
      encodeURIComponent(DISCORD_INVITE_CODE) + "?with_counts=true";
    const response = await fetch(url, {
      headers: { "Accept": "application/json" },
      cache: "no-store"
    });
    if (!response.ok) throw new Error("Discord invite niet beschikbaar (HTTP " + response.status + ").");
    const invite = await response.json();
    const count = invite.approximate_member_count;
    if (typeof count !== "number") throw new Error("Discord gaf geen ledenaantal terug.");
    el("discordMembers").textContent = count.toLocaleString();
    el("discordName").textContent = invite.guild?.name || "Discord community";
    showStatus("discord", "Discord online", true);
  } catch (error) {
    el("discordMembers").textContent = "—";
    showStatus("discord", "Discord count niet beschikbaar", false);
    console.warn("[Discord]", error);
  } finally {
    discordBusy = false;
  }
}

async function refreshAll() {
  await Promise.allSettled([updateERLC(), updateDiscord()]);
}
el("refresh").addEventListener("click", refreshAll);

// Fetch immediately, then update every 30 seconds.
// Skip background polling while hidden; refresh immediately when the tab is active again.
refreshAll();
setInterval(() => { if (!document.hidden) refreshAll(); }, REFRESH_INTERVAL);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });
window.addEventListener("focus", refreshAll);

// Casual copy deterrents only. They cannot prevent viewing page source or network traffic.
document.addEventListener("contextmenu", event => event.preventDefault());
document.addEventListener("copy", event => event.preventDefault());
document.addEventListener("cut", event => event.preventDefault());
document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  if (((event.ctrlKey || event.metaKey) && ["c","u","s"].includes(key)) ||
      event.key === "F12" ||
      ((event.ctrlKey || event.metaKey) && event.shiftKey && ["i","j","c"].includes(key))) {
    event.preventDefault();
    event.stopPropagation();
  }
}, true);
</script>
</body>
</html>
