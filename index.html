<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075b19">
<title>DDH Roleplay — Live Status</title>
<style>
:root{--green:#075b19;--green2:#034312;--yellow:#ffd84d;--cream:#f7f3e8;--muted:#c9d8c8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;background:#080c08;color:var(--cream);font-family:Inter,Arial,sans-serif}
.dashboard{width:min(1120px,100%);min-height:690px;position:relative;overflow:hidden;border-radius:38px;padding:clamp(24px,5vw,62px);background:linear-gradient(135deg,var(--green),#087021 60%,var(--green2));box-shadow:0 25px 90px #0009;display:flex;flex-direction:column}
.stripe{position:absolute;top:-30%;bottom:-30%;width:15%;transform:skewX(-27deg);background:#003c10;opacity:.34;pointer-events:none}
.stripe.one{left:12%}.stripe.two{left:40%;opacity:.2}.stripe.three{left:83%;opacity:.28}.stripe.gold{left:67%;width:4%;background:var(--yellow);opacity:.13}
header,.content,.footer,.meta,.actions,.notice{position:relative;z-index:1}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.brand{color:var(--yellow)}
h1{text-align:center;font-size:clamp(2.5rem,7vw,5.7rem);line-height:1;margin:40px 0 10px;letter-spacing:-.065em}
.subtitle{text-align:center;color:var(--muted);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem}
.content{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:46px 0 28px}
.stat{border:1px solid #ffffff25;background:#002d0d55;border-radius:24px;padding:26px;text-align:center;backdrop-filter:blur(4px)}
.stat-label{color:var(--muted);font-size:.82rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.stat-value{font-size:clamp(3.7rem,11vw,7.4rem);font-weight:900;line-height:1.1;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.stat-value.yellow{color:var(--yellow)}
.stat-detail{color:var(--muted);font-size:.92rem;margin-top:6px}
.footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto;font-weight:800}
.pill{border:1px solid #ffffff30;border-radius:999px;padding:11px 16px;background:#003b12a8}
.pill b{color:var(--yellow)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.82rem}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aaa;margin-right:8px}
.status-dot.ok{background:#8bff9b;box-shadow:0 0 10px #8bff9b}
.actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
button,.join{border:1px solid #ffffff45;border-radius:999px;padding:11px 18px;background:#003e12;color:var(--cream);font-weight:800;text-decoration:none;cursor:pointer}
.join{background:var(--yellow);color:#18210d;border-color:var(--yellow)}
button:disabled{opacity:.6;cursor:wait}
.notice{min-height:1.4em;text-align:center;margin-top:12px;color:#ffe1d9;font-size:.85rem}
@media(max-width:620px){body{padding:10px}.dashboard{min-height:calc(100vh - 20px);border-radius:25px;padding:24px 17px}.content{gap:10px;margin:34px 0 22px}.stat{padding:18px 8px;border-radius:18px}.stat-value{font-size:clamp(3rem,15vw,5rem)}h1{margin-top:34px}.footer{font-size:.9rem}.meta{font-size:.74rem}}
</style>
</head>
<body>
<main class="dashboard">
  <div class="stripe one"></div><div class="stripe two"></div><div class="stripe three"></div><div class="stripe gold"></div>
  <header>
    <div class="topline"><span class="brand">DDH ROLEPLAY</span><span>LIVE SERVER STATUS</span></div>
    <h1>In-Game Players</h1>
    <div class="subtitle">Emergency Response: Liberty County</div>
  </header>
  <section class="content" aria-live="polite">
    <div class="stat">
      <div class="stat-label">In-game players</div>
      <div class="stat-value" id="players">—</div>
      <div class="stat-detail">Maximum <span id="maxPlayers">—</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Discord members</div>
      <div class="stat-value yellow" id="discordMembers">—</div>
      <div class="stat-detail" id="discordName">Dutch Den Haag Roleplay</div>
    </div>
  </section>
  <section class="footer">
    <div class="pill">JOIN CODE: <b id="joinCode">--------</b></div>
    <div class="pill">QUEUE: <b id="queue">—</b></div>
    <div class="pill">DISCORD: <b>ddhrpnl</b></div>
  </section>
  <section class="meta">
    <span><i class="status-dot" id="erlcDot"></i><span id="erlcStatus">ER:LC wordt geladen…</span></span>
    <span><i class="status-dot" id="discordDot"></i><span id="discordStatus">Discord wordt geladen…</span></span>
    <span>Last update: <time id="updated">—</time></span>
  </section>
  <div class="actions">
    <button id="refresh" type="button">↻ Refresh now</button>
    <a class="join" href="https://discord.gg/ddhrpnl" target="_blank" rel="noopener noreferrer">Join Discord ↗</a>
  </div>
  <div class="notice" id="notice" role="status"></div>
</main>
<script>
"use strict";
const DISCORD_INVITE_CODE = "ddhrpnl";
const STATUS_URL = "./status.json";
const REFRESH_INTERVAL = 30000;
const el = id => document.getElementById(id);
function setStatus(name, message, online) {
  el(name + "Status").textContent = message;
  el(name + "Dot").classList.toggle("ok", Boolean(online));
}
async function updateERLC() {
  try {
    const response = await fetch(STATUS_URL + "?t=" + Date.now(), {cache:"no-store"});
    if (!response.ok) throw new Error("status.json niet gevonden (HTTP " + response.status + ")");
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || "GitHub Actions kon ER:LC niet ophalen.");
    el("players").textContent = Number(data.currentPlayers).toLocaleString("nl-NL");
    el("maxPlayers").textContent = Number(data.maxPlayers).toLocaleString("nl-NL");
    el("joinCode").textContent = data.joinCode || "--------";
    el("queue").textContent = data.queue ?? "0";
    setStatus("erlc", "ER:LC online", true);
    el("updated").textContent = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString("nl-NL") : "—";
    el("notice").textContent = "";
  } catch (error) {
    setStatus("erlc", "ER:LC niet verbonden", false);
    el("notice").textContent = error.message + " Controleer of de GitHub Action succesvol is uitgevoerd.";
  }
}
async function updateDiscord() {
  try {
    const url = "https://discord.com/api/v10/invites/" + encodeURIComponent(DISCORD_INVITE_CODE) + "?with_counts=true";
    const response = await fetch(url, {headers:{Accept:"application/json"},cache:"no-store"});
    if (!response.ok) throw new Error("Discord HTTP " + response.status);
    const invite = await response.json();
    if (typeof invite.approximate_member_count !== "number") throw new Error("Geen ledental");
    el("discordMembers").textContent = invite.approximate_member_count.toLocaleString("nl-NL");
    el("discordName").textContent = invite.guild?.name || "Discord community";
    setStatus("discord", "Discord online", true);
  } catch (error) {
    el("discordMembers").textContent = "—";
    setStatus("discord", "Discord count niet beschikbaar", false);
  }
}
async function refreshAll() {
  el("refresh").disabled = true;
  await Promise.allSettled([updateERLC(), updateDiscord()]);
  el("refresh").disabled = false;
}
el("refresh").addEventListener("click", refreshAll);
refreshAll();
setInterval(() => { if (!document.hidden) refreshAll(); }, REFRESH_INTERVAL);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });
</script>
</body>
</html>
