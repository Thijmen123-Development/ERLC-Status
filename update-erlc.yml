name: Update ERLC server status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch ERLC server status
        env:
          ERLC_API_KEY: ${{ secrets.ERLC_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          key = os.environ.get("ERLC_API_KEY", "").strip()
          output = {
              "ok": False,
              "error": "GitHub Secret ERLC_API_KEY ontbreekt.",
              "updatedAt": datetime.now(timezone.utc).isoformat()
          }

          if key:
              url = "https://api.erlc.gg/v2/server?Queue=true"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Server-Key": key,
                      "Accept": "application/json",
                      "User-Agent": "DDH-Roleplay-GitHub-Status/1.0"
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.loads(response.read().decode("utf-8"))
                  server = data.get("server") or data.get("Server") or data
                  current = server.get("CurrentPlayers", server.get("currentPlayers"))
                  maximum = server.get("MaxPlayers", server.get("maxPlayers"))
                  if current is None or maximum is None:
                      raise ValueError("ER:LC antwoord bevat geen CurrentPlayers/MaxPlayers.")
                  queue = data.get("Queue", data.get("queue", server.get("Queue", server.get("queue", 0))))
                  if isinstance(queue, list):
                      queue = len(queue)
                  output = {
                      "ok": True,
                      "currentPlayers": current,
                      "maxPlayers": maximum,
                      "joinCode": server.get("JoinKey", server.get("joinKey", "")),
                      "queue": queue if queue is not None else 0,
                      "updatedAt": datetime.now(timezone.utc).isoformat()
                  }
              except urllib.error.HTTPError as e:
                  output["error"] = f"ER:LC HTTP {e.code}: {e.read().decode('utf-8', 'replace')[:400]}"
              except Exception as e:
                  output["error"] = str(e)

          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Update ERLC status"
          git push
